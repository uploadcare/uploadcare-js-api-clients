name: contract

# Runs api-emulator's contract tests against the real Upload API, on demand:
# by hand, or by labelling a pull request `contract`. Not on a schedule.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  contract:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'contract'
    runs-on: ubuntu-latest
    env:
      # A missing secret fails the run (see test/contract.test.ts); it never
      # falls back to the emulator.
      CONTRACT_PUBLIC_KEY: ${{ secrets.UPLOAD_CLIENT_DEFAULT_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm i
      - run: npm run test:contract -w packages/api-emulator
