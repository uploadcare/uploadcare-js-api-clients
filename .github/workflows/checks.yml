name: checks

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UPLOAD_CLIENT_DEFAULT_PUBLIC_KEY: ${{ secrets.UPLOAD_CLIENT_DEFAULT_PUBLIC_KEY }}
      REST_CLIENT_DEFAULT_PUBLIC_KEY: ${{ secrets.REST_CLIENT_DEFAULT_PUBLIC_KEY }}
      REST_CLIENT_DEFAULT_SECRET_KEY: ${{ secrets.REST_CLIENT_DEFAULT_SECRET_KEY }}
      # A project with Signed Uploads enabled, which rejects every unsigned
      # request, so it cannot be the default one. Absent them, the JWT
      # integration tests skip rather than fail.
      UPLOAD_CLIENT_SECURE_UPLOADS_PUBLIC_KEY: ${{ secrets.UPLOAD_CLIENT_SECURE_UPLOADS_PUBLIC_KEY }}
      UPLOAD_CLIENT_SECURE_UPLOADS_SECRET_KEY: ${{ secrets.UPLOAD_CLIENT_SECURE_UPLOADS_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            rest-client:
              - 'packages/rest-client/**'
              - 'packages/api-client-utils/**'
            upload-client:
              - 'packages/upload-client/**'
              - 'packages/api-client-utils/**'
              # The whole suite runs against the emulator (`test/_emulator.ts`), so an
              # emulator-only change has to re-run it.
              - 'packages/api-emulator/**'
            api-emulator:
              - 'packages/api-emulator/**'
            api-client-utils:
              - 'packages/api-client-utils/**'
            signed-uploads:
              - 'packages/signed-uploads/**'
            image-shrink:
              - 'packages/image-shrink/**'
            cname-prefix:
              - 'packages/cname-prefix/**'
            quality-insights:
              - 'packages/quality-insights/**'
      - name: Install dependencies
        working-directory: ./
        run: npm i
      - name: Run build
        working-directory: ./
        run: npm run build
      - name: Run lint
        working-directory: ./
        run: npm run lint

      - name: Lint `api-emulator`
        if: steps.changes.outputs.api-emulator == 'true'
        run: npm run lint -w packages/api-emulator

      - name: Check `api-emulator` formatting
        if: steps.changes.outputs.api-emulator == 'true'
        run: npm run format:check -w packages/api-emulator

      # `./browser`'s tests run in a real Chromium (Vitest browser mode). System
      # packages aren't covered by the browser cache, so they install every time;
      # only the browser binaries are cache-gated.
      - name: Install Chromium system deps for `api-emulator`
        if: steps.changes.outputs.api-emulator == 'true'
        timeout-minutes: 10
        env:
          # `install-deps` shells out to apt-get; keep it from stalling on an
          # interactive prompt (e.g. Ubuntu's needrestart).
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: npx playwright install-deps chromium
        working-directory: ./packages/api-emulator

      - uses: actions/cache@v4
        if: steps.changes.outputs.api-emulator == 'true'
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium for `api-emulator`
        if: steps.changes.outputs.api-emulator == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: npx playwright install chromium
        working-directory: ./packages/api-emulator

      - name: Run `api-emulator` tests
        if: steps.changes.outputs.api-emulator == 'true'
        run: npm run test -w packages/api-emulator

      - name: Run `upload-client` mock tests
        if: steps.changes.outputs.upload-client == 'true'
        run: npm run test -w packages/upload-client

      - name: Run `signed-uploads` local tests
        if: steps.changes.outputs.signed-uploads == 'true'
        run: npm run test -w packages/signed-uploads

      - name: Run `api-client-utils` local tests
        if: steps.changes.outputs.api-client-utils == 'true'
        run: npm run test -w packages/api-client-utils

      - name: Run `rest-client` integration tests
        if: steps.changes.outputs.rest-client == 'true'
        run: npm run test:production -w packages/rest-client

      # Real-API drift is reported on a pull request, not blocking it: the
      # emulator-backed run above is the gate. On master it still blocks.
      - name: Run `upload-client` integration tests
        if: steps.changes.outputs.upload-client == 'true'
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: npm run test:production -w packages/upload-client
